<nav id="site-nav" class="site-nav" aria-label="Publication chapters" x-on:click="if ($event.target.closest('a')) menuOpen = false">
  <button class="nav-close" type="button" aria-label="Close menu" x-on:click="menuOpen = false">
    <span></span>
    <span></span>
  </button>
  <div class="nav-scroll">
    <a class="site-title" href="{{indexHref}}">The Fire Kasina</a>
    <ul>
{{items}}
    </ul>
  </div>
  <div class="nav-actions">
    <button class="theme-toggle" type="button" x-on:click="theme = theme === 'dark' ? 'light' : 'dark'" x-text="theme === 'dark' ? 'Light theme' : 'Dark theme'"></button>
    <button class="mode-toggle" type="button" x-on:click="contentMode = contentMode === 'translation' ? 'bilingual' : 'translation'" x-text="contentMode === 'translation' ? 'Bilingual mode' : 'Only translation'"></button>
  </div>
