<nav
    id="site-nav"
    class="site-nav"
    aria-label="Publication chapters"
    x-on:click="if ($event.target.closest('a')) menuOpen = false"
>
    <button
        class="nav-close"
        type="button"
        aria-label="Close menu"
        x-on:click="menuOpen = false"
    >
        <span></span>
        <span></span>
    </button>

    <div class="nav-scroll">
        <a class="site-title" href="{{indexHref}}">The Fire Kasina</a>
        <ul>
            {{items}}
        </ul>
    </div>
    <div class="nav-actions">
        <fieldset class="mode-toggle" aria-label="Text display mode">
            <label>
                <input
                    type="radio"
                    name="content-mode"
                    value="bilingual"
                    x-model="contentMode"
                />
                <span>Билингва</span>
            </label>
            <label>
                <input
                    type="radio"
                    name="content-mode"
                    value="translation"
                    x-model="contentMode"
                />
                <span>Только перевод</span>
            </label>
            <label>
                <input
                    type="radio"
                    name="content-mode"
                    value="original"
                    x-model="contentMode"
                />
                <span>Только оригинал</span>
            </label>
        </fieldset>

        <button
            class="theme-toggle"
            type="button"
            x-on:click="theme = theme === 'dark' ? 'light' : 'dark'"
            x-text="theme === 'dark' ? 'Светлая тема' : 'Темная тема'"
        ></button>
    </div>
</nav>
