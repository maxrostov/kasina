<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <link
            rel="shortcut icon"
            type="image/x-icon"
            href="https://secure.gravatar.com/blavatar/759e0b9aea1e0bd1d6447c694b63be03ef302f7d6ca3ab7aa9fa39c753916350?s=32"
            sizes="16x16"
        />
        <link
            rel="icon"
            type="image/x-icon"
            href="https://secure.gravatar.com/blavatar/759e0b9aea1e0bd1d6447c694b63be03ef302f7d6ca3ab7aa9fa39c753916350?s=32"
            sizes="16x16"
        />
        <link
            rel="apple-touch-icon"
            href="https://secure.gravatar.com/blavatar/759e0b9aea1e0bd1d6447c694b63be03ef302f7d6ca3ab7aa9fa39c753916350?s=114"
        />

        <title>{{title}}</title>
        {{stylesheets}} {{scripts}} {{serviceWorker}}
    </head>
    <body data-theme="light" {{contentModeAttributes}} data-menu-open="false">
        <div class="layout">
            <button
                class="menu-toggle"
                type="button"
                aria-label="Open menu"
                aria-controls="site-nav"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-backdrop"></div>
            <div class="shell">
                <main>
                    {{body}}

                    <div
                        style="
                            margin-top: 3em;
                            opacity: 0.5;
                            font-family: sans-serif;
                            font-variant: all-small-caps;
                            text-transform: uppercase;
                        "
                    >
                        переведено нейросетью Gemini 3.1
                    </div>
                </main>
                {{nav}}
            </div>
        </div>
    </body>
</html>
