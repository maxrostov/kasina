<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
{{stylesheets}}
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="{ theme: $persist('light').as('kasina-theme'), contentMode: $persist('bilingual').as('kasina-content-mode'), menuOpen: false }" x-bind:data-theme="theme" x-bind:data-content-mode="contentMode" x-bind:data-menu-open="menuOpen" x-on:keydown.escape.window="menuOpen = false">
  <div class="layout">
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="site-nav" x-bind:aria-expanded="menuOpen.toString()" x-on:click="menuOpen = true">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="nav-backdrop" x-on:click="menuOpen = false"></div>
    <div class="shell">
      <main>
{{body}}
      </main>
      {{nav}}
    </div>
  </div>
</body>
</html>
