<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#151817" media="(prefers-color-scheme: dark)">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Fire Kasina">
        <link rel="manifest" href="site.webmanifest">
        <link
            rel="shortcut icon"
            type="image/png"
            href="icons/favicon-32.png"
            sizes="32x32"
        />
        <link
            rel="icon"
            type="image/png"
            href="icons/favicon-32.png"
            sizes="32x32"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="icons/apple-touch-icon-180.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="167x167"
            href="icons/apple-touch-icon-167.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="152x152"
            href="icons/apple-touch-icon-152.png"
        />

        <title>{{title}}</title>
        {{stylesheets}} {{scripts}} {{analytics}} {{serviceWorker}}
    </head>
    <body data-theme="light" {{contentModeAttributes}} data-menu-open="false">
        <div class="layout">
            <button
                class="menu-toggle"
                type="button"
                aria-label="Open menu"
                aria-controls="site-nav"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-backdrop"></div>
            <div class="shell">
                <main>
                    {{body}}

                    <div
                        style="
                            margin-top: 3em;
                            opacity: 0.5;
                            font-family: sans-serif;
                            font-variant: all-small-caps;
                            text-transform: uppercase;
                        "
                    >
                        переведено нейросетью Gemini 3.1
                    </div>
                </main>
                {{nav}}
            </div>
        </div>
    </body>
</html>
